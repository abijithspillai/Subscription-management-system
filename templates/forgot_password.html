{% extends "base.html" %}

{% block title %}Reset Password | Brightloop Software{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
    <div class="text-center mb-6">
        <div class="w-12 h-12 mx-auto rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-xl mb-3">
            <i class="fa-solid fa-key"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Forgot Password?</h2>
        <p class="text-xs text-slate-500 mt-1">Enter your registered email address and we will dispatch a secure reset link.</p>
    </div>

    <form action="{{ url_for('forgot_password') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Registered Email</label>
            <input type="email" name="email" required placeholder="you@company.com" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold text-sm shadow-md shadow-brand-500/20">
            Send Reset Link
        </button>
    </form>

    <div class="mt-6 text-center">
        <a href="{{ url_for('login') }}" class="text-xs font-semibold text-brand-600 hover:text-brand-700">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back to Sign In
        </a>
    </div>
</div>
{% endblock %}
