{% extends "base.html" %}

{% block title %}Enter New Password | Brightloop Software{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
    <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-slate-900">Set New Password</h2>
        <p class="text-xs text-slate-500 mt-1">Resetting password for <span class="font-semibold text-slate-800">{{ email }}</span></p>
    </div>

    <form action="{{ url_for('reset_password') }}" method="POST" class="space-y-4">
        <input type="hidden" name="email" value="{{ email }}">
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">New Password</label>
            <input type="password" name="password" required placeholder="New secure password" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
            <p class="text-[11px] text-slate-400 mt-1">>8 chars, uppercase, lowercase, special char.</p>
        </div>
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Confirm New Password</label>
            <input type="password" name="confirm_password" required placeholder="Confirm password" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm shadow-md shadow-emerald-500/20">
            Save New Password
        </button>
    </form>
</div>
{% endblock %}
